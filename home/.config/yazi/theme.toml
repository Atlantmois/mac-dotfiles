# yazi 主题：与 Ghostty 的 "TokyoNight Moon" 调色板 + 透明背景统一
# ============================================================================
# 机制（先看懂这个，否则会觉得这份配置"写得少"）：
#
#   yazi 出厂预设（yazi-config/preset/theme-dark.toml）里的颜色**全是 ANSI 具名色**
#   （blue / cyan / red / magenta / darkgray …），它们直接映射到终端的 16 色调色板。
#   你 Ghostty 里已经有 `theme = "TokyoNight Moon"`，所以 yazi 的配色**本来就是跟着
#   Ghostty 走的**，不需要把 16 个色值抄一遍 —— 抄了反而会在你换 Ghostty 主题时脱节。
#
#   同理，透明也是默认行为：`[app] overall` 默认为空，yazi 不会通过 OSC 11 去改
#   终端背景，壁纸自然透出来。
#
# 所以这份 theme.toml 只覆盖两类**真有毛病**的地方，其余一律沿用出厂预设：
#
#   1. 预设给彩色徽章只设了 bg、没设 fg（如 normal_main = { bg = "blue" }）——
#      在 TokyoNight 这种**浅色** accent 上就是浅字压浅底，对比度不够。
#      Helix 那边是显式写了 fg = "bg" 的，这里对齐同一套做法：
#      用 "black"（ANSI 0 = #1b1d2b）当彩色底上的文字色。
#   2. select 与 unset 两种模式预设**都是红色**，肉眼分不出当前处于哪种。
#      把 select 改成 magenta —— 既与 Helix 的 ui.statusline.select（magenta）一致，
#      也让两种模式可区分。
#
# 另外把面板分隔线调暗一档：预设 gray（ANSI 7 = #828bb8）在透明背景上偏亮，
# darkgray（ANSI 8 = #444a73）更接近东京夜的 gutter 调子。
# ============================================================================

[app]
# 显式保留为空：不改终端背景 ⇒ 保持透明。
# （这是出厂默认值，写出来是为了防止以后被别的配置或 flavor 覆盖成实色）
overall = {}

[mgr]
# 面板分隔线与符号链接目标：降一档亮度，别在壁纸上显得糊
border_style   = { fg = "darkgray" }
symlink_target = { fg = "darkgray", italic = true }

[tabs]
# 彩色底上补 fg，解决浅色 accent 上对比度不足
active   = { fg = "black", bg = "blue", bold = true }
inactive = { fg = "blue", bg = "darkgray" }

[mode]
# 三态各自区分：normal=蓝 / select=品红 / unset=红；彩底一律补 fg = "black"
normal_main = { fg = "black",   bg = "blue",    bold = true }
normal_alt  = { fg = "blue",    bg = "darkgray" }
select_main = { fg = "black",   bg = "magenta", bold = true }
select_alt  = { fg = "magenta", bg = "darkgray" }
unset_main  = { fg = "black",   bg = "red",     bold = true }
unset_alt   = { fg = "red",     bg = "darkgray" }

[status]
# 权限分隔符降一档，避免状态栏里一串亮灰
perm_sep = { fg = "darkgray" }
