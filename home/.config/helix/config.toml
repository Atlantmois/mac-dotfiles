# 内置主题；与 Ghostty 的 theme = "TokyoNight Moon" 是同一套调色板。
# （2026-09-26：原先用的是自定义主题 my-transparent —— 已删除，改回内置。）
theme = "tokyonight"

[editor]
trim-trailing-whitespace = true
# 上一条不是冗余：Helix 的默认值是 false（见 helix-view/src/editor.rs 的
# impl Default for Config），所以你这条是有效改动。

# ── 相对行号 ─────────────────────────────────────────────────────────
# 默认 "absolute"。改成 relative 后，配合 vim 式动作可以"数着跳"：
#   5j / 12G / d3k / y4j
# 对 Helix 的实际操作体感提升最明显的一项。零开销。
line-number = "relative"

# ── 模式变色 ─────────────────────────────────────────────────────────
# 默认 false。开启后**状态栏的模式指示器**按模式换底色（颜色来自主题的
# ui.statusline.normal/insert/select：normal 蓝 / insert 绿 / select 品红），
# 一眼就知道当前在哪个模式。零开销。
# 2026-09-26 更正：原注释写的是"光标所在行的背景色随模式变化"——那是 cursorline
# 的职责（下面那条已停用）；color-modes 只作用于模式指示器。实测：状态栏的
# NOR 徽章随模式变色，光标所在行没有任何变色。
color-modes = true

# ── 高亮当前行（2026-09-19 停用）─────────────────────────────────────
# 默认 false。开启后会拿主题的 ui.cursorline.primary 铺满当前行；内置
# tokyonight_moon 给的是 bg-menu = #1e2030（rgb 30,32,48），比编辑器底色
# #222436（rgb 34,36,54）略暗，铺满后就是一条横贯整窗的淡暗带。
# 光标本身已经能指示当前行，这条横带收益不抵视觉成本，故停用。
# 2026-09-26 更正：原注释写的是「bg-menu = #16161e / 透明主题 / 加到
# my-transparent.toml」——#16161e 是 base tokyonight 的取值（Moon 是 #1e2030），
# 透明方案与 my-transparent.toml 都已废弃，实测 rgb(38,35,77) 那种"周围背景"
# 是当时壁纸混色，不适用了。
# 想要回来：取消下面那行注释；想连暗带一起去掉就自建一个主题文件覆盖：
#   inherits = "tokyonight_moon"
#   "ui.cursorline.primary" = { bg = "bg" }   # 与底色一致
# cursorline = true

# ── 第 88 列标尺（2026-09-19 停用）───────────────────────────────────
# 88 是 ruff 的默认行宽（实测：85 列不动、95 列才折行），这条线原本是给
# ruff format 做视觉预警的。当时的停用理由是「主题透明、壁纸透出来，不透明的
# 标尺成了糊在照片上的亮线」。
# 2026-09-26 更正：已改回内置不透明主题，且 tokyonight_moon 的
# ui.virtual.ruler = { bg = "fg-gutter" } = #3b4261，对底色 #222436 只是对比度
# 1.56 的暗线——"亮线"的前提已不成立，要不要重新打开可以按新依据再判。
# ruff format 照旧按 88 折行，只是不再有那条参考线。
# 想要回来：取消下面那行注释；想保留线又嫌亮，在主题里加
#   "ui.virtual.ruler" = { bg = "bg" }
# 按 PEP 8 想用 79 就写 [79, 88]。
# rulers = [88]

# 默认 false。强制 24 位真彩色，Ghostty 完全支持，避免配色被降到 256 色。
true-color = true

# 默认 5。调大后光标靠近上下边缘时保留更多上下文。
scrolloff = 8

# 默认 "never"。打开后在顶部显示已打开的 buffer（代价：占 1 行高度）。
bufferline = "multiple"

# ── 缩进参考线 ───────────────────────────────────────────────────────
# 默认 render = false。Python 靠缩进表达结构，这条收益明显。
[editor.indent-guides]
render = true

# ── 语言服务器 ───────────────────────────────────────────────────────
# 当前未启用（Helix 默认 false；下面被注释的那行就是开启方式）。开启后 ty 会把
# 推断出的类型以行内文字显示在变量旁边。这是全部新增项里唯一有可感开销的一条
# （要渲染额外文本），但对课程作业这种小文件可以忽略。
[editor.lsp]
# display-inlay-hints = true

# 让 Ghostty 的光标轨迹在 Helix 里生效。
# Helix 对 block 光标是「自己画」的：它会隐藏硬件光标，Ghostty 于是拿不到
# 光标位置，直接跳过整段光标 uniform 更新，轨迹必然不出现。
# 用非 block 形状 = 把光标交回终端，轨迹才会工作。
[editor.cursor-shape]
normal = "underline"   # 正常模式：下划线仍表示「操作这个字符」，且不遮住字形
insert = "bar"         # 插入模式：竖线，vim 惯例
select = "underline"   # 选择模式：同 normal，避免出现 block 导致轨迹断档

# Cmd+Enter = 在下方新建一行并进入插入模式（对应 VS Code 的 Insert Line Below）。
# 只在 insert mode 生效 —— normal mode 有 o 就够了。
# 依赖 Ghostty 侧已解绑 Cmd+Enter 并按 Kitty 键盘协议原样转发。
[keys.insert]
"Cmd-ret" = "open_below"
