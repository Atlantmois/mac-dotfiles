# ompmin — OMP-native minimal mode.
#
# Design: keep a tiny, stable, cache-friendly prefix and exactly one coherent
# tool set. It intentionally disables every auxiliary producer that would add
# prompt text, extra LLM calls, extra tool schemas, or context files.
#
# Loaded with: omp --config ~/.omp/ompmin/config.yml ... (see the `ompmin`
# launcher, which adds the flags this overlay cannot express)
#
# Measured on omp 18.2.11 / deepseek-flash, identical prompt:
#   default            20,764 prompt tokens
#   this overlay+flags  2,723 prompt tokens (-86.9%); warm prefix caches 2,560
#   bash-only surface   1,138 prompt tokens
# Cache economics: the reduced prompt is 2,560 tokens of prefix that DeepSeek
# caches (cacheRead is ~1/50 of the input rate). A cold first call costs more
# than a fully cached default call, so the win compounds within the cache TTL,
# not on a single cold request.

# --- Auxiliary context / LLM features: off -------------------------------
compaction:
  enabled: false           # no auto-summarization LLM calls and no automatic
                           # context recovery: keep interactive sessions short,
                           # or re-enable it per run with a later overlay
                           # (`ompmin --config my-overlay.yml`, later --config
                           # files override this one)
skills:
  enabled: false
ttsr:
  enabled: false
todo:
  enabled: false
plan:
  enabled: false
goal:
  enabled: false
recap:
  enabled: false
prewalk:
  enabled: false
contextPromotion:
  enabled: false
magicKeywords:
  enabled: false
lsp:
  enabled: false
memories:
  enabled: false
memory:
  backend: off
branchSummary:
  enabled: false
autolearn:
  enabled: false
advisor:
  enabled: false

# --- Network / browser / remote capabilities: off ------------------------
web_search:
  enabled: false
fetch:
  enabled: false
exa:
  enabled: false
browser:
  enabled: false
computer:
  enabled: false
github:
  enabled: false

# --- Structural editing / debugging extras: off --------------------------
astEdit:
  enabled: false
astGrep:
  enabled: false
find:
  enabled: false
debug:
  enabled: false
checkpoint:
  enabled: false

# --- Prompt-shape controls ----------------------------------------------
includeModelInPrompt: false
includeWorkspaceTree: false
skillful: false
autoResume: false
extendedContext: false
startup:
  checkUpdate: false
# Fallback thinking level only: when the active role carries an explicit
# suffix (this machine: `deepseek/deepseek-flash:high`), the suffix wins and
# this key is ignored. The `ompmin` launcher therefore always passes
# `--thinking low`, which does override the role suffix.
defaultThinkingLevel: low

# --- Tool behavior -------------------------------------------------------
tools:
  approvalMode: always-ask  # reads proceed; writes and execution require approval
  intentTracing: false     # no "concise intent" parameter on every tool
  xdev: false              # keep the public tool surface flat
  artifactSpillThreshold: 10   # KB; larger outputs spill to artifact
  artifactHeadBytes: 4
  artifactTailBytes: 4
  artifactTailLines: 120

# --- Context isolation ---------------------------------------------------
# Keep native settings/provider discovery (needed for model + auth), but drop
# every other discovery provider: external AGENTS.md/CLAUDE.md/GEMINI.md,
# plugin rules/skills/tools, MCP hosts, built-in rulebook, etc.
disabledProviders:
  - omp-plugins
  - claude
  - agent-plugins
  - agents
  - claude-plugins
  - codex
  - gemini
  - opencode
  - cursor
  - windsurf
  - cline
  - github
  - vscode
  - mcp-json
  - ssh-json
  - agents-md
  - claude-md
  - builtin-defaults

# The native provider still supplies ~/.omp/agent/AGENTS.md and project
# .omp/AGENTS.md; suppress both by extension id to keep the prompt small.
# The essential authorization rule is in SYSTEM.md. RULES.md is suppressed by
# --no-rules in the wrapper, so no context file reaches the request.
disabledExtensions:
  - context-file:user:AGENTS.md
  - context-file:project:AGENTS.md
